name: Deploy

on:
  workflow_dispatch:

jobs:
  build:
    name: Build workspace
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

  deploy-placeholder:
    name: Deploy placeholder
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Keep deployment disabled
        run: |
          echo "Build succeeded. SSH deployment to qdsj.top is intentionally not configured yet."
          echo "Add host, user, key, and remote path secrets when deployment is ready."
